<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>已封鎖 — Dopamine Detox</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      text-align: center;
      max-width: 420px;
      width: 90%;
      padding: 48px 32px;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 20px;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 20px;
      display: block;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.4px;
    }

    .reason-text {
      font-size: 15px;
      color: #888;
      line-height: 1.65;
      margin-bottom: 36px;
    }

    .info-box {
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 28px;
      font-size: 13px;
      color: #aaa;
      text-align: left;
    }

    .info-box strong {
      color: #e0e0e0;
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .info-box .value {
      font-size: 18px;
      font-weight: 600;
      color: #3a8cff;
      margin-top: 2px;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.85; }

    .btn-reset {
      background: #2a2a2a;
      color: #aaa;
      border: 1px solid #333;
    }

    .btn-settings {
      background: #3a8cff;
      color: #fff;
    }

    .domain-tag {
      display: inline-block;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 20px;
    }

  </style>
</head>
<body>
  <div class="card">
    <span class="icon" id="icon">🔒</span>
    <h1 id="title">網站已被封鎖</h1>
    <div class="domain-tag" id="domain-tag"></div>
    <p class="reason-text" id="reason-text"></p>

    <div class="info-box" id="info-box" style="display:none">
      <strong id="info-label"></strong>
      <div class="value" id="info-value"></div>
    </div>

    <div class="btn-group">
      <button class="btn-reset" id="btn-reset" style="display:none">↺ 重置今日使用量</button>
      <button class="btn-settings" id="btn-settings">⚙ 調整設定</button>
    </div>
  </div>

  <script src="blocked.js"></script>
  <script src='../vendor/kofi-overlay-widget.js'></script>
  <script>
    kofiWidgetOverlay.draw('apollo888', {
      'type': 'floating-chat',
      'floating-chat.donateButton.text': 'Support me',
      'floating-chat.donateButton.background-color': '#00b9fe',
      'floating-chat.donateButton.text-color': '#fff'
    });
  </script>
</body>
</html>
