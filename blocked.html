<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>已封鎖 — Dopamine Detox</title>
  <style>
    :root {
      --bg:         #0f1116;
      --bg-soft:    #131722;
      --surface:    #171b25;
      --surface-2:  #1a2030;
      --border:     #2b3245;
      --text:       #e8edf9;
      --text-muted: #96a2bd;
      --text-dim:   #5a6580;
      --accent:     #3a8cff;
      --accent-soft:#84b6ff;
      --accent-dim: rgba(58,140,255,0.16);
      --danger:     #e57373;
      --shadow:     0 18px 40px rgba(0,0,0,0.42);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(120% 75% at 10% 0%, #1e2a46 0%, transparent 48%),
        radial-gradient(100% 70% at 100% 100%, #12213e 0%, transparent 52%),
        linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 55%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      text-align: center;
      max-width: 420px;
      width: 90%;
      padding: 48px 32px 40px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
      animation: card-in 280ms ease-out both;
    }

    @keyframes card-in {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 3px;
      background: linear-gradient(90deg, #2f6df6 0%, #69a7ff 100%);
    }

    /* ── Icon ── */
    .icon-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrap::before {
      content: '';
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(58,140,255,0.18) 0%, transparent 65%);
      animation: icon-pulse 2.8s ease-in-out infinite;
    }

    .icon-wrap.is-limit::before  { background: radial-gradient(circle, rgba(245,169,35,0.18) 0%, transparent 65%); }
    .icon-wrap.is-blocked::before { background: radial-gradient(circle, rgba(229,115,115,0.18) 0%, transparent 65%); }

    @keyframes icon-pulse {
      0%, 100% { opacity: 0.5; transform: scale(0.92); }
      50%       { opacity: 1;   transform: scale(1.08); }
    }

    .icon {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-dim);
      border: 1px solid rgba(58,140,255,0.3);
      border-radius: 18px;
      color: var(--accent);
      position: relative;
      z-index: 1;
    }

    .icon.is-limit   { background: rgba(245,169,35,0.12); border-color: rgba(245,169,35,0.3); color: #f5a923; }
    .icon.is-blocked { background: rgba(229,115,115,0.12); border-color: rgba(229,115,115,0.3); color: var(--danger); }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .reason-text {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 28px;
      white-space: pre-line;
    }

    .info-box {
      background: linear-gradient(180deg, var(--surface-2) 0%, #1a2234 100%);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 24px;
      text-align: left;
    }

    .info-box strong {
      color: var(--text-dim);
      display: block;
      margin-bottom: 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info-box .value {
      font-size: 17px;
      font-weight: 600;
      color: var(--accent-soft);
      font-variant-numeric: tabular-nums;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 150ms, background 150ms, border-color 150ms;
    }

    .btn-reset {
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-reset:hover { background: var(--surface); border-color: var(--accent); color: var(--accent-soft); }

    .btn-settings {
      background: linear-gradient(180deg, #4b95ff 0%, var(--accent) 100%);
      color: #fff;
      border: 1px solid var(--accent);
      box-shadow: 0 4px 14px rgba(58,140,255,0.3);
    }
    .btn-settings:hover { opacity: 0.88; }

    .domain-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-dim);
      border: 1px solid rgba(83,168,255,0.3);
      border-radius: 999px;
      padding: 4px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-soft);
      margin-bottom: 16px;
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
      .icon-wrap::before { animation: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap" id="icon-wrap">
      <div class="icon" id="icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
    </div>
    <h1 id="title">網站已被封鎖</h1>
    <div class="domain-tag" id="domain-tag"></div>
    <p class="reason-text" id="reason-text"></p>

    <div class="info-box" id="info-box" style="display:none">
      <strong id="info-label"></strong>
      <div class="value" id="info-value"></div>
    </div>

    <div class="btn-group">
      <button class="btn-reset" id="btn-reset" style="display:none">重置今日使用量</button>
      <button class="btn-settings" id="btn-settings">調整設定</button>
    </div>
    <img src="icons/taiwan-simplemaps.svg" alt="" aria-hidden="true" style="position:absolute;bottom:16px;right:16px;width:48px;opacity:0.06;pointer-events:none;user-select:none;filter:brightness(2);">
  </div>

  <script src="blocked.js"></script>
</body>
</html>
