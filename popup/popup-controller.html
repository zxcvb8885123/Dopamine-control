<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root { --bg: #0c0c0c; --card: #161616; --accent: #3a8cff; --danger: #ff4d4d; --text: #f0f0f0; --border: #262626; }
    body { width: 360px; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui; margin: 0; }
    .header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .tabs { display: flex; background: #111; padding: 4px; gap: 4px; }
    .tab-btn { flex: 1; padding: 8px; border: none; background: transparent; color: #666; cursor: pointer; border-radius: 6px; font-size: 12px; transition: 0.2s; }
    .tab-btn.active { background: var(--card); color: var(--accent); font-weight: bold; }
    .content { padding: 20px; min-height: 320px; }
    .pane { display: none; }
    .pane.active { display: block; animation: fadeIn 0.2s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .card { background: var(--card); border-radius: 12px; padding: 12px; border: 1px solid var(--border); margin-bottom: 15px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .row:last-child { margin-bottom: 0; }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
    input[type="text"], input[type="number"], input[type="time"] { background: #000; border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 6px; }
    .tag { background: #222; padding: 4px 10px; border-radius: 6px; font-size: 11px; margin: 3px; display: inline-flex; align-items: center; border: 1px solid #333; }
    .tag-del { margin-left: 6px; cursor: pointer; color: #555; }
    .btn-save { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
    .btn-reset { width: 100%; background: transparent; color: #555; border: 1px solid #222; padding: 10px; margin-top: 10px; border-radius: 8px; cursor: pointer; font-size: 11px; }
  </style>
</head>
<body>
  <div class="header"><strong>FocusFlow Pro</strong><input type="checkbox" id="master-enabled"></div>
  <div class="tabs">
    <button class="tab-btn active" data-pane="visual">介面優化</button>
    <button class="tab-btn" data-pane="limit">每日限時</button>
    <button class="tab-btn" data-pane="block">時段封鎖</button>
  </div>
  <div class="content">
    <div id="pane-visual" class="pane active">
      <div class="card">
        <div class="row"><span>YouTube 推薦/Shorts</span><input type="checkbox" id="f-yt"></div>
        <div class="row"><span>Facebook 動態牆/廣告</span><input type="checkbox" id="f-fb"></div>
        <div class="row"><span>Instagram 探索頁面</span><input type="checkbox" id="f-ig"></div>
        <div class="row"><span>Dcard 熱門看板</span><input type="checkbox" id="f-dc"></div>
      </div>
    </div>
    <div id="pane-limit" class="pane">
      <div id="limit-list"></div>
      <div class="card">
        <input type="text" id="l-dom" placeholder="網域..." style="width:120px">
        <input type="number" id="l-min" placeholder="分鐘" style="width:60px">
        <button id="l-add" style="background:var(--accent); color:white; border:none; padding:6px 10px; border-radius:6px; cursor:pointer">＋</button>
      </div>
    </div>
    <div id="pane-block" class="pane">
      <div class="card">
        <div class="row"><span>開始</span><input type="time" id="w-start"></div>
        <div class="row"><span>結束</span><input type="time" id="w-end"></div>
      </div>
      <div id="b-tags" style="margin-bottom:10px"></div>
      <div class="card">
        <input type="text" id="b-input" placeholder="封鎖網域..." style="width:70%">
        <button id="b-add" style="background:#333; color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer">＋</button>
      </div>
    </div>
    <button class="btn-save" id="save-btn">保存並同步所有設定</button>
    <button class="btn-reset" id="reset-btn">解除並還原所有設定</button>
  </div>
  <script src="popup-controller.js"></script>
</body>
</html>
