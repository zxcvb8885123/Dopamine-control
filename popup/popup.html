<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>FocusFlow Pro</title>
  <style>
    :root {
      --bg-color: #111;
      --card-bg: #1a1a1a;
      --accent-color: #3a8cff;
      --text-main: #fff;
      --text-dim: #999;
      --danger: #e57373;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      max-height: 600px;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
    }
    /* 頂部 Header */
    .header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      background: var(--bg-color);
      z-index: 100;
    }
    .logo-group { display: flex; align-items: center; gap: 8px; }
    .logo-group h2 { font-size: 16px; letter-spacing: 0.5px; }
    
    /* 分頁導覽 */
    .nav-tabs {
      display: flex;
      background: #151515;
      padding: 4px;
      margin: 12px 20px;
      border-radius: 8px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 12px;
      transition: 0.3s;
      border-radius: 6px;
    }
    .tab-btn.active {
      background: var(--card-bg);
      color: var(--accent-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    /* 內容區 */
    .tab-content { padding: 0 20px 20px; }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .section-title { font-size: 13px; color: var(--accent-color); margin: 15px 0 10px; font-weight: 600; }
    .card { background: var(--card-bg); padding: 12px; border-radius: 10px; margin-bottom: 10px; }

    /* 組長的清單樣式優化 */
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #222; }
    .item-row:last-child { border: none; }
    .progress-container { margin-top: 4px; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
    .progress-bar { height: 100%; transition: width 0.5s ease; }

    /* 輸入框與按鈕 */
    .input-group { display: flex; gap: 6px; margin-top: 10px; }
    input { background: #252525; border: 1px solid #333; color: white; padding: 8px; border-radius: 6px; font-size: 12px; }
    .btn-primary { width: 100%; padding: 12px; background: var(--accent-color); border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 10px; }
    .btn-add { background: #333; border: none; color: white; width: 32px; border-radius: 6px; cursor: pointer; }
    
    .footer { text-align: center; padding: 15px; font-size: 10px; color: #444; border-top: 1px solid #222; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-group"><span>🛡️</span><h2>FocusFlow Pro</h2></div>
    <input type="checkbox" id="enabled">
  </div>

  <nav class="nav-tabs">
    <button class="tab-btn active" data-tab="visual">介面優化</button>
    <button class="tab-btn" data-tab="limit">每日限時</button>
    <button class="tab-btn" data-tab="advanced">時段/冷卻</button>
  </nav>

  <div class="tab-content">
    <div id="visual" class="tab-pane active">
      <div class="section-title">已啟用的平台守護</div>
      <div class="card">
        <div class="item-row"><span>YouTube 推薦/側邊欄</span>✅</div>
        <div class="item-row"><span>Facebook 動態牆</span>✅</div>
        <div class="item-row"><span>Instagram 探索頁面</span>✅</div>
        <div class="item-row"><span>Dcard 熱門看板</span>✅</div>
      </div>
    </div>

    <div id="limit" class="tab-pane">
      <div class="section-title">網站使用限額</div>
      <div id="limit-list"></div>
      <div class="input-group">
        <input type="text" id="limit-domain" placeholder="例：youtube.com" style="flex:2">
        <input type="number" id="limit-min" placeholder="分" style="flex:1">
        <button class="btn-add" id="limit-add">＋</button>
      </div>
    </div>

    <div id="advanced" class="tab-pane">
      <div class="section-title">工作時段封鎖</div>
      <div class="card">
        <div class="item-row">
          <span>開始時段</span><input type="time" id="workStart">
        </div>
        <div class="item-row">
          <span>結束時段</span><input type="time" id="workEnd">
        </div>
      </div>
      <div class="section-title">強制冷卻秒數</div>
      <input type="number" id="cooldownSeconds" style="width: 100%">
    </div>

    <button id="save-settings" class="btn-primary">保存所有設定</button>
    <div id="status-msg" style="text-align:center; font-size:11px; margin-top:8px; height:12px"></div>
  </div>

  <div class="footer">© 2026 FocusFlow Pro | 數位注意力優化方案</div>

  <script src="popup.js"></script>
</body>
</html>
