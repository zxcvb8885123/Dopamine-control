<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Dopamine Detox</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      max-height: 580px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #111;
      color: #e0e0e0;
      font-size: 13px;
    }

    /* 捲軸 */
    body::-webkit-scrollbar { width: 4px; }
    body::-webkit-scrollbar-track { background: transparent; }
    body::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #111;
      padding: 16px 20px 12px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h3 { font-size: 14px; color: #fff; font-weight: 600; }

    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #888;
    }

    /* iOS-style toggle */
    .toggle { position: relative; width: 36px; height: 20px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: #333; border-radius: 20px; cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; top: 3px;
      background: #fff; border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle input:checked + .toggle-slider { background: #3a8cff; }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

    .content { padding: 0 20px 20px; }

    /* 區塊 */
    .section { margin-top: 20px; }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    .field-label {
      font-size: 12px;
      color: #aaa;
      margin: 10px 0 5px;
    }

    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }

    input[type="number"],
    input[type="text"],
    input[type="time"] {
      width: 100%;
      padding: 7px 10px;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #3a8cff; }
    input::placeholder { color: #444; }
    input[type="time"] { color-scheme: dark; cursor: pointer; }

    /* 網域標籤清單 */
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 28px;
      padding: 8px;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #252525;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 12px;
      color: #ccc;
    }

    .tag-del {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      width: auto;
      margin: 0;
      transition: color 0.15s;
    }
    .tag-del:hover { color: #e57373; }

    .tag-empty { font-size: 12px; color: #444; align-self: center; }

    /* 每日限時的行 */
    .limit-row {
      padding: 8px 10px;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .limit-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .limit-domain {
      font-size: 13px;
      font-weight: 600;
      color: #e0e0e0;
    }

    .limit-row-bottom {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .limit-row-bottom label {
      font-size: 11px;
      color: #666;
      text-transform: none;
      letter-spacing: 0;
      margin: 0;
    }

    .limit-min {
      width: 64px;
      padding: 4px 8px;
      background: #252525;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      text-align: center;
      outline: none;
    }

    .limit-min:focus { border-color: #3a8cff; }

    .limit-unit { font-size: 12px; color: #555; }

    .limit-usage-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 5px;
    }
    .usage-used   { color: #666; }
    .usage-remain { color: #3a8cff; }
    .usage-exhausted { color: #e57373; }

    .usage-bar-bg {
      height: 3px;
      background: #252525;
      border-radius: 2px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .usage-bar {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s;
    }

    .btn-reset-usage {
      padding: 2px 8px;
      background: #1a1a1a;
      border: 1px solid #e57373;
      border-radius: 6px;
      color: #e57373;
      font-size: 11px;
      cursor: pointer;
      width: auto;
      margin: 0;
      transition: background 0.15s;
    }
    .btn-reset-usage:hover { background: #2a1a1a; }

    /* 新增輸入列 */
    .add-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .add-row input { flex: 1; }

    .btn-add {
      padding: 7px 12px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      color: #3a8cff;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      width: auto;
      margin: 0;
      transition: background 0.15s;
    }
    .btn-add:hover { background: #252525; }

    /* 儲存按鈕 */
    .btn-save {
      width: 100%;
      padding: 10px;
      margin-top: 20px;
      background: #3a8cff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-save:hover { background: #2a7cef; }

    .status {
      text-align: center;
      font-size: 12px;
      height: 18px;
      margin-top: 8px;
      transition: color 0.2s;
    }

    .divider {
      height: 1px;
      background: #1e1e1e;
      margin-top: 20px;
    }

    /* Ko-fi 贊助區塊 */
    .kofi-wrap {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #1e1e1e;
      text-align: center;
    }

    .kofi-wrap p {
      font-size: 11px;
      color: #444;
      margin-bottom: 8px;
    }

    .btn-kofi {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      background: #1a1a1a;
      border: 1px solid #2e2e2e;
      border-radius: 20px;
      color: #aaa;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      width: auto;
      margin: 0;
    }

    .btn-kofi:hover {
      border-color: #ff5e5b;
      color: #ff5e5b;
    }

    .btn-kofi .kofi-icon { font-size: 14px; }
  </style>
</head>
<body>

  <div class="header">
    <h3>Dopamine Detox</h3>
    <div class="toggle-wrap">
      <span id="enabled-label">啟用中</span>
      <label class="toggle">
        <input type="checkbox" id="enabled">
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <div class="content">

    <!-- 工作時段 -->
    <div class="section">
      <div class="section-title">工作時段封鎖</div>
      <div class="field-label">時段</div>
      <div class="row">
        <input type="time" id="workStart">
        <input type="time" id="workEnd">
      </div>

      <div class="field-label">工作時段封鎖的網站</div>
      <div class="tag-list" id="blocked-list"></div>
      <div class="add-row">
        <input type="text" id="blocked-input" placeholder="例：tiktok.com">
        <button class="btn-add" id="blocked-add" title="新增">＋</button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 每日限時 -->
    <div class="section">
      <div class="section-title">每日限時</div>
      <div id="limit-list"></div>
      <div class="add-row" style="margin-top:6px">
        <input type="text"   id="limit-domain-input" placeholder="例：youtube.com" style="flex:2">
        <input type="number" id="limit-min-input"    placeholder="分" min="1" style="flex:1">
        <button class="btn-add" id="limit-add" title="新增">＋</button>
      </div>
      <div style="font-size:11px;color:#444;margin-top:5px">0 分鐘 = 不限制</div>
    </div>

    <div class="divider"></div>

    <!-- 強制冷卻 -->
    <div class="section">
      <div class="section-title">強制冷卻覆蓋</div>
      <div class="field-label">冷卻秒數</div>
      <input type="number" id="cooldownSeconds" min="5" max="300" placeholder="預設 20 秒" style="width:120px">

      <div class="field-label" style="margin-top:10px">套用冷卻的網站</div>
      <div class="tag-list" id="cooldown-list"></div>
      <div class="add-row">
        <input type="text" id="cooldown-input" placeholder="例：instagram.com">
        <button class="btn-add" id="cooldown-add" title="新增">＋</button>
      </div>
    </div>

  <div class="divider"></div>

    <!-- 介面去刺激化 -->
    <div class="section">
      <div class="section-title">介面極簡化 (Declutter)</div>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px;">
        <div class="field-label" style="margin: 0;">隱藏網頁冗餘元素 (如側邊欄、廣告)</div>
        <label class="toggle">
          <input type="checkbox" id="declutterEnabled">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <button class="btn-save" id="save">儲存設定</button>
    <div class="status" id="status"></div>

    <div class="kofi-wrap">
      <p>覺得這個插件有幫助嗎？</p>
      <button class="btn-kofi" id="btn-kofi">
        <span class="kofi-icon">☕</span> 請我喝杯咖啡
      </button>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
