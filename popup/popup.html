<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dopamine Detox</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:         #0f1116;
      --bg-soft:    #131722;
      --surface:    #171b25;
      --surface-2:  #1a2030;
      --border:     #2b3245;
      --border-soft:#1e2438;
      --text:       #e8edf9;
      --text-muted: #96a2bd;
      --text-dim:   #5a6580;
      --accent:     #3a8cff;
      --accent-soft:#84b6ff;
      --accent-dim: rgba(58,140,255,0.16);
      --danger:     #e57373;
      --shadow:     0 18px 40px rgba(0,0,0,0.42);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      height: 580px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(80% 50% at 0% 0%, #1a2540 0%, transparent 55%),
        radial-gradient(60% 40% at 100% 100%, #12213e 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    body::-webkit-scrollbar { width: 4px; }
    body::-webkit-scrollbar-track { background: transparent; }
    body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header h3 { font-size: 14px; color: var(--text); font-weight: 700; display: flex; align-items: center; }

    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .toggle { position: relative; width: 36px; height: 20px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0;
      background: var(--border); border-radius: 20px; cursor: pointer;
      transition: background 150ms;
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; top: 3px;
      background: #fff; border-radius: 50%;
      transition: transform 150ms;
    }
    .toggle input:checked + .toggle-slider { background: var(--accent); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

    .content { padding: 0 20px 20px; }

    .section { margin-top: 20px; }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }

    .field-label {
      font-size: 12px;
      color: var(--text-muted);
      margin: 10px 0 5px;
    }

    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }

    input[type="number"],
    input[type="text"],
    input[type="time"] {
      width: 100%;
      padding: 7px 10px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 150ms, box-shadow 150ms;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }
    input::placeholder { color: var(--text-dim); }
    input[type="time"] { color-scheme: dark; cursor: pointer; }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 28px;
      padding: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      margin-bottom: 6px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .tag-del {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0;
      width: auto;
      margin: 0;
      transition: color 150ms;
    }
    .tag-del:hover { color: var(--danger); }

    .tag-empty { font-size: 12px; color: var(--text-dim); align-self: center; }

    .limit-row {
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      margin-bottom: 6px;
    }

    .limit-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .limit-domain {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .limit-row-bottom {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .limit-row-bottom label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: none;
      letter-spacing: 0;
      margin: 0;
    }

    .limit-min {
      width: 64px;
      padding: 4px 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      text-align: center;
      outline: none;
      transition: border-color 150ms, box-shadow 150ms;
    }
    .limit-min:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    .limit-unit { font-size: 12px; color: var(--text-dim); }

    .limit-usage-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 5px;
    }
    .usage-used      { color: var(--text-dim); }
    .usage-remain    { color: var(--accent); }
    .usage-exhausted { color: var(--danger); }

    .usage-bar-bg {
      height: 3px;
      background: var(--surface-2);
      border-radius: 2px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .usage-bar {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s;
    }

    .btn-reset-usage {
      padding: 2px 8px;
      background: var(--surface);
      border: 1px solid var(--danger);
      border-radius: 6px;
      color: var(--danger);
      font-size: 11px;
      cursor: pointer;
      width: auto;
      margin: 0;
      transition: background 150ms;
    }
    .btn-reset-usage:hover { background: rgba(229,115,115,0.1); }

    .add-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .add-row input { flex: 1; }

    .btn-add {
      padding: 7px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--accent);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      width: auto;
      margin: 0;
      transition: background 150ms, border-color 150ms;
    }
    .btn-add:hover { background: var(--surface-2); border-color: var(--accent); }

    .btn-save {
      width: 100%;
      padding: 10px;
      margin-top: 20px;
      background: linear-gradient(180deg, #4b95ff 0%, var(--accent) 100%);
      color: #fff;
      border: 1px solid var(--accent);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 150ms;
      box-shadow: 0 4px 14px rgba(58,140,255,0.3);
    }
    .btn-save:hover { opacity: 0.88; }

    .btn-report {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      background: var(--surface);
      color: var(--accent-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 150ms, background 150ms;
    }
    .btn-report:hover {
      background: var(--surface-2);
      border-color: var(--accent);
    }

    .status {
      text-align: center;
      font-size: 12px;
      height: 18px;
      margin-top: 8px;
      transition: color 150ms;
    }

    .divider {
      height: 1px;
      background: var(--border-soft);
      margin-top: 20px;
    }

  </style>
</head>
<body>

  <div class="header">
    <h3>
      <img src="../icons/taiwan-icon-wiki.svg" alt="" aria-hidden="true" style="height:14px;width:auto;vertical-align:middle;margin-right:6px;opacity:0.75;">Dopamine Detox
    </h3>
    <div class="toggle-wrap">
      <span id="enabled-label">啟用中</span>
      <label class="toggle">
        <input type="checkbox" id="enabled">
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <div class="content">

    <!-- 工作時段 -->
    <div class="section">
      <div class="section-title">工作時段封鎖</div>
      <div class="field-label">時段</div>
      <div class="row">
        <input type="time" id="workStart">
        <input type="time" id="workEnd">
      </div>

      <div class="field-label">工作時段封鎖的網站</div>
      <div class="tag-list" id="blocked-list"></div>
      <div class="add-row">
        <input type="text" id="blocked-input" placeholder="例：tiktok.com">
        <button class="btn-add" id="blocked-add" title="新增">＋</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="section">
      <div class="section-title"></div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 5px 0;">
        <span style="color: var(--text-muted);">專注瀏覽模式</span>
        <label class="toggle">
          <input type="checkbox" id="declutter-toggle">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="divider"></div>

    <!-- 每日限時 -->
    <div class="section">
      <div class="section-title">每日限時</div>
      <div id="limit-list"></div>
      <div class="add-row" style="margin-top:6px">
        <input type="text"   id="limit-domain-input" placeholder="例：youtube.com" style="flex:2">
        <input type="number" id="limit-min-input"    placeholder="分" min="1" style="flex:1">
        <button class="btn-add" id="limit-add" title="新增">＋</button>
      </div>
      <div style="font-size:11px;color:var(--text-dim);margin-top:5px">0 分鐘 = 不限制</div>
    </div>

    <div class="divider"></div>

    <!-- 強制冷卻 -->
    <div class="section">
      <div class="section-title">強制冷卻覆蓋</div>
      <div class="field-label">冷卻秒數</div>
      <input type="number" id="cooldownSeconds" min="5" max="300" placeholder="預設 20 秒" style="width:120px">

      <div class="field-label" style="margin-top:10px">套用冷卻的網站</div>
      <div class="tag-list" id="cooldown-list"></div>
      <div class="add-row">
        <input type="text" id="cooldown-input" placeholder="例：instagram.com">
        <button class="btn-add" id="cooldown-add" title="新增">＋</button>
      </div>
    </div>

    <button class="btn-save" id="save">儲存設定</button>
    <button class="btn-report" id="open-report">查看數據報表</button>
    <div class="status" id="status"></div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
