<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1116;
      --bg-soft: #131722;
      --card: #171b25;
      --card-2: #1a2030;
      --text: #e8edf9;
      --muted: #96a2bd;
      --line: #2b3245;
      --accent: #3a8cff;
      --accent-soft: #84b6ff;
      --btn-bg: #1b2233;
      --btn-text: #add0ff;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.42);
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(120% 75% at 10% 0%, #1e2a46 0%, transparent 48%),
        radial-gradient(100% 70% at 100% 100%, #12213e 0%, transparent 52%),
        linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 55%);
      color: var(--text);
      animation: fadeIn 240ms ease-out;
    }

    .card {
      max-width: 430px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 3px;
      background: linear-gradient(90deg, #2f6df6 0%, #69a7ff 100%);
      opacity: 0.95;
    }

    h1 {
      margin: 2px 0 6px;
      font-size: 19px;
      letter-spacing: 0.2px;
      font-weight: 700;
    }

    .sub {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 13px;
    }

    .range-buttons {
      display: flex;
      gap: 8px;
      margin: 0 0 14px;
      padding: 4px;
      background: rgba(19, 26, 41, 0.9);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .range-btn {
      flex: 1;
      border: 1px solid transparent;
      border-radius: 9px;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 12px;
      padding: 8px 0;
      font-weight: 600;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
    }

    .range-btn:hover {
      transform: translateY(-1px);
      border-color: #3b4f78;
      background: #202a40;
    }

    .range-btn.is-active {
      background: linear-gradient(180deg, #4b95ff 0%, var(--accent) 100%);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 6px 16px rgba(58, 140, 255, 0.35);
    }

    .metrics {
      display: flex;
      gap: 8px;
      margin: 0 0 12px;
    }

    .metric {
      flex: 1;
      background: linear-gradient(180deg, var(--card-2) 0%, #1a2234 100%);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      color: #c6d4ef;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .top-domain {
      margin: 0 0 12px;
      padding: 11px 12px;
      border-radius: 10px;
      background: linear-gradient(90deg, rgba(58, 140, 255, 0.13) 0%, rgba(58, 140, 255, 0.03) 100%);
      color: var(--accent-soft);
      font-size: 13px;
      border: 1px solid #355184;
      letter-spacing: 0.1px;
      font-weight: 600;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    li {
      padding: 12px;
      border: 1px solid var(--line);
      background: rgba(22, 27, 38, 0.88);
      border-radius: 10px;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    li:hover {
      transform: translateY(-1px);
      border-color: #4067a9;
      background: #1b2438;
    }

    .domain-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .domain-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      background: #1e2b48;
      color: #9dc1ff;
      border: 1px solid #355184;
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .domain {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
      color: #dce6fb;
      font-weight: 700;
      letter-spacing: 0.1px;
    }

    .time {
      color: #dbe9ff;
      background: rgba(58, 140, 255, 0.18);
      border: 1px solid rgba(83, 168, 255, 0.45);
      border-radius: 999px;
      padding: 3px 9px;
      font-weight: 600;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .domain-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      color: #b6c8ea;
      font-size: 12px;
      font-weight: 500;
      margin-top: 2px;
    }

    .empty {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px;
      padding: 10px 12px;
      background: #151b2a;
      border: 1px dashed #33405f;
      border-radius: 10px;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      body { padding: 12px; }
      .card {
        border-radius: 16px;
        padding: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="report-title">Report</h1>
    <p class="sub" id="report-range">Loading...</p>

    <div class="range-buttons" role="group" aria-label="Report range" id="range-group">
      <button type="button" class="range-btn is-active" data-range="daily" aria-pressed="true">Daily</button>
      <button type="button" class="range-btn" data-range="weekly" aria-pressed="false">Weekly</button>
      <button type="button" class="range-btn" data-range="monthly" aria-pressed="false">Monthly</button>
    </div>

    <div class="metrics">
      <p class="metric" id="period-total">Total: --</p>
      <p class="metric" id="period-avg">Avg/day: --</p>
    </div>

    <p class="top-domain" id="top-domain">Top 1: --</p>
    <ul id="usage-list"></ul>
    <p class="empty" id="empty-tip" hidden>No usage data for this period.</p>
  </main>

  <script type="module" src="./report.js"></script>
</body>
</html>
