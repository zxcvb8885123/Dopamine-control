<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:         #0f1116;
      --bg-soft:    #131722;
      --surface:    #171b25;
      --surface-2:  #1a2030;
      --border:     #2b3245;
      --text:       #e8edf9;
      --text-muted: #96a2bd;
      --text-dim:   #5a6580;
      --accent:     #3a8cff;
      --accent-soft:#84b6ff;
      --accent-dim: rgba(58,140,255,0.16);
      --danger:     #e57373;
      --shadow:     0 18px 40px rgba(0,0,0,0.42);
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(120% 75% at 10% 0%, #1e2a46 0%, transparent 48%),
        radial-gradient(100% 70% at 100% 100%, #12213e 0%, transparent 52%),
        linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 55%);
      color: var(--text);
      animation: fadeIn 240ms ease-out;
    }

    .card {
      max-width: 430px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 3px;
      background: linear-gradient(90deg, #2f6df6 0%, #69a7ff 100%);
      opacity: 0.95;
    }

    h1 {
      margin: 2px 0 6px;
      font-size: 19px;
      letter-spacing: 0.2px;
      font-weight: 700;
    }

    .sub {
      margin: 0 0 14px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .range-buttons {
      display: flex;
      gap: 8px;
      margin: 0 0 14px;
      padding: 4px;
      background: rgba(19, 26, 41, 0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .range-btn {
      flex: 1;
      border: 1px solid transparent;
      border-radius: 9px;
      background: var(--surface-2);
      color: var(--accent-soft);
      font-size: 12px;
      padding: 8px 0;
      font-weight: 600;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease, border-color 150ms ease, box-shadow 150ms ease;
    }

    .range-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(58,140,255,0.35);
      background: var(--surface-2);
    }

    .range-btn.is-active {
      background: linear-gradient(180deg, #4b95ff 0%, var(--accent) 100%);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 6px 16px rgba(58, 140, 255, 0.35);
    }

    .metrics {
      display: flex;
      gap: 8px;
      margin: 0 0 12px;
    }

    .metric {
      flex: 1;
      background: linear-gradient(180deg, var(--surface-2) 0%, #1a2234 100%);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      color: var(--text-muted);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .top-domain {
      margin: 0 0 12px;
      padding: 11px 12px;
      border-radius: 10px;
      background: linear-gradient(90deg, rgba(58, 140, 255, 0.13) 0%, rgba(58, 140, 255, 0.03) 100%);
      color: var(--accent-soft);
      font-size: 13px;
      border: 1px solid #355184;
      letter-spacing: 0.1px;
      font-weight: 600;
    }

    .category-card {
      margin: 0 0 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(17, 24, 39, 0.52);
    }

    .category-title {
      margin: 0 0 10px;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    .category-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .category-item {
      padding: 0;
      border: none;
      background: transparent;
      border-radius: 0;
      cursor: pointer;
    }

    .category-item:hover {
      transform: none;
      border-color: transparent;
      background: transparent;
    }

    .category-item:hover .category-label,
    .category-item:focus-visible .category-label {
      color: var(--accent-soft);
    }

    .category-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 8px;
    }

    .category-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .category-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }

    .category-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--category-color, var(--accent));
      box-shadow: 0 0 12px var(--category-glow, rgba(58,140,255,0.28));
      flex-shrink: 0;
    }

    .category-time {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .category-track {
      height: 5px;
      border-radius: 999px;
      background: var(--surface-2);
      overflow: hidden;
    }

    .category-fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--category-color, var(--accent)), rgba(132, 182, 255, 0.86));
      transition: width 500ms ease;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    li {
      padding: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: 10px;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    li:hover {
      transform: translateY(-1px);
      border-color: rgba(58,140,255,0.45);
      background: var(--surface-2);
    }

    .domain-group {
      padding: 12px;
      border: 1px solid var(--border);
      background: rgba(26, 32, 48, 0.72);
      border-radius: 12px;
      scroll-margin-top: 20px;
    }

    .domain-group:hover {
      transform: none;
      border-color: var(--border);
      background: rgba(26, 32, 48, 0.72);
    }

    .domain-group.is-highlighted {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim), 0 14px 32px rgba(58, 140, 255, 0.16);
    }

    .domain-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(43, 50, 69, 0.72);
    }

    .domain-group-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
    }

    .domain-group-time {
      color: var(--accent-soft);
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .domain-group-list {
      display: grid;
      gap: 8px;
    }

    .domain-item {
      padding: 10px;
      border: 1px solid rgba(43, 50, 69, 0.84);
      background: var(--surface-2);
      border-radius: 10px;
    }

    .domain-item:hover {
      transform: translateY(-1px);
      border-color: rgba(58,140,255,0.45);
      background: var(--surface-2);
    }

    .domain-category-select {
      width: 100%;
      margin-top: 9px;
      border: 1px solid rgba(58,140,255,0.28);
      border-radius: 9px;
      background: rgba(15, 17, 22, 0.58);
      color: var(--accent-soft);
      padding: 7px 9px;
      font-size: 12px;
      font-weight: 700;
      outline: none;
    }

    .domain-category-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    .domain-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .domain-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--accent-soft);
      border: 1px solid rgba(58,140,255,0.3);
      font-size: 11px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .domain {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
      color: var(--text);
      font-weight: 700;
      letter-spacing: 0.1px;
    }

    .time {
      color: #dbe9ff;
      background: rgba(58, 140, 255, 0.18);
      border: 1px solid rgba(83, 168, 255, 0.45);
      border-radius: 999px;
      padding: 3px 9px;
      font-weight: 600;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .domain-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      margin-top: 4px;
    }

    .progress-track {
      height: 3px;
      background: var(--surface-2);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent) 0%, var(--accent-soft) 100%);
      border-radius: 2px;
      transition: width 500ms ease;
      width: 0%;
    }

    @keyframes li-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .empty {
      margin: 2px 0 0;
      color: var(--text-muted);
      font-size: 13px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px dashed rgba(58,140,255,0.2);
      border-radius: 10px;
      text-align: center;
    }

    .section {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .ai-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
    }

    .field input,
    .field select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface);
      color: var(--text);
      padding: 9px 10px;
      font-size: 13px;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(58, 140, 255, 0.16);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(17, 24, 39, 0.72);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    .toggle-row input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .custom-fields[hidden] {
      display: none;
    }

    .ai-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .ai-btn {
      flex: 1;
      border: 1px solid rgba(58,140,255,0.35);
      border-radius: 9px;
      background: var(--surface-2);
      color: var(--accent-soft);
      font-size: 12px;
      padding: 9px 10px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease, border-color 150ms ease;
    }

    .ai-btn:hover {
      transform: translateY(-1px);
      background: var(--surface-2);
      border-color: var(--accent);
    }

    .ai-btn.primary {
      background: linear-gradient(180deg, #4b95ff 0%, var(--accent) 100%);
      color: #fff;
      border-color: var(--accent);
    }

    .ai-status {
      min-height: 18px;
      margin: 9px 0 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .ai-status.is-error {
      color: #ff9d9d;
    }

    .ai-status.is-ok {
      color: #9ee6b4;
    }

    .ai-result {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .ai-result[hidden] {
      display: none;
    }

    .ai-result-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-2);
      padding: 10px;
    }

    .ai-result-item h3 {
      margin: 0 0 6px;
      color: #9dc1ff;
      font-size: 12px;
    }

    .ai-result-item p {
      margin: 0;
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      body { padding: 12px; }
      .card {
        border-radius: 16px;
        padding: 14px;
      }
    }

    @media (min-width: 760px) {
      body {
        padding: 24px;
      }

      .card {
        max-width: 900px;
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.8fr);
        gap: 16px 18px;
        align-items: start;
        padding: 20px;
      }

      h1,
      .sub,
      .range-buttons,
      .metrics {
        grid-column: 1 / -1;
      }

      .top-domain,
      .category-card,
      #usage-list,
      .empty {
        grid-column: 1;
      }

      .section {
        grid-column: 2;
        grid-row: 5 / span 4;
        margin-top: 0;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: rgba(17, 24, 39, 0.36);
      }

      .domain {
        max-width: 280px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="report-title">Report</h1>
    <p class="sub" id="report-range">Loading...</p>

    <div class="range-buttons" role="group" aria-label="Report range" id="range-group">
      <button type="button" class="range-btn is-active" data-range="daily" aria-pressed="true">Daily</button>
      <button type="button" class="range-btn" data-range="weekly" aria-pressed="false">Weekly</button>
      <button type="button" class="range-btn" data-range="monthly" aria-pressed="false">Monthly</button>
    </div>

    <div class="metrics">
      <p class="metric" id="period-total">Total: --</p>
      <p class="metric" id="period-avg">Avg/day: --</p>
    </div>

    <p class="top-domain" id="top-domain">Top 1: --</p>
    <section class="category-card" aria-labelledby="category-title">
      <h2 class="category-title" id="category-title">分類分布</h2>
      <ul class="category-list" id="category-list"></ul>
    </section>
    <ul id="usage-list"></ul>
    <p class="empty" id="empty-tip" hidden>No usage data for this period.</p>

    <section class="section" aria-labelledby="ai-settings-title">
      <h2 class="section-title" id="ai-settings-title">AI 使用行為分析</h2>
      <div class="ai-grid">
        <label class="field">
          API Provider
          <select id="ai-provider">
            <option value="openai">OpenAI</option>
            <option value="gemini">Gemini</option>
            <option value="custom">Custom</option>
          </select>
        </label>

        <label class="field">
          API Key
          <input type="password" id="ai-api-key" autocomplete="off">
        </label>

        <div class="custom-fields" id="ai-custom-fields" hidden>
          <label class="field">
            API Endpoint
            <input type="text" id="ai-endpoint" placeholder="https://example.com/v1/chat/completions">
          </label>
        </div>

        <label class="toggle-row">
          <span>啟用 AI 分析</span>
          <input type="checkbox" id="ai-enabled">
        </label>
      </div>

      <div class="ai-actions">
        <button type="button" class="ai-btn" id="ai-save">儲存設定</button>
        <button type="button" class="ai-btn primary" id="ai-generate">產生 AI 分析</button>
      </div>
      <p class="ai-status" id="ai-status"></p>
      <div class="ai-result" id="ai-result" hidden>
        <article class="ai-result-item">
          <h3 id="ai-summary-title">今日使用摘要</h3>
          <p id="ai-summary"></p>
        </article>
        <article class="ai-result-item">
          <h3 id="ai-anomaly-title">使用時間提醒</h3>
          <p id="ai-anomaly"></p>
        </article>
        <article class="ai-result-item">
          <h3 id="ai-suggestion-title">明日改善建議</h3>
          <p id="ai-suggestion"></p>
        </article>
      </div>
    </section>
  </main>

  <img src="../icons/taiwan-simplemaps.svg" alt="" aria-hidden="true" style="position:fixed;bottom:20px;right:20px;width:48px;opacity:0.06;pointer-events:none;user-select:none;filter:brightness(2);">
  <script type="module" src="./report.js"></script>
</body>
</html>
